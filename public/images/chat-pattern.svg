<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <style>
      .doodle {
        stroke: #ffffff;
        stroke-opacity: 0.065;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .doodle-fill {
        fill: #ffffff;
        fill-opacity: 0.04;
      }
    </style>
  </defs>

  <!-- 1. Telegram Paper Plane -->
  <g class="doodle" transform="translate(35, 30) rotate(-15) scale(0.9)">
    <path d="M 2 14 L 26 2 L 18 26 L 12 18 Z" />
    <path d="M 12 18 L 26 2" />
    <path d="M 12 18 L 11 23 L 15 20" />
  </g>

  <!-- 2. Cat Face with ears and whiskers -->
  <g class="doodle" transform="translate(120, 25) scale(0.85)">
    <path d="M 6 12 C 6 20 22 20 22 12 C 22 8 20 5 18 6 L 19 1 L 14 4 C 13 4 11 4 10 4 L 5 1 L 6 6 C 4 7 6 10 6 12 Z" />
    <circle cx="10" cy="11" r="0.75" class="doodle-fill" />
    <circle cx="18" cy="11" r="0.75" class="doodle-fill" />
    <path d="M 13 13 L 15 13 L 14 14.5 Z" />
    <path d="M 4 12 L 1 11 M 4 14 L 1 15 M 24 12 L 27 11 M 24 14 L 27 15" />
  </g>

  <!-- 3. Saturn Planet with Ring -->
  <g class="doodle" transform="translate(225, 35) rotate(-20) scale(0.9)">
    <circle cx="15" cy="15" r="9" />
    <path d="M 1 15 C 1 11 29 11 29 15 C 29 19 1 19 1 15" />
  </g>

  <!-- 4. 4-point Sparkle Star -->
  <g class="doodle" transform="translate(330, 30) scale(0.9)">
    <path d="M 12 2 Q 12 12 2 12 Q 12 12 12 22 Q 12 12 22 12 Q 12 12 12 2 Z" />
  </g>

  <!-- Mini filler sparkle -->
  <g class="doodle" transform="translate(85, 75) scale(0.5)">
    <path d="M 8 0 L 8 16 M 0 8 L 16 8" />
  </g>
  <circle cx="185" cy="70" r="1.5" class="doodle" />
  <circle cx="295" cy="75" r="1.2" class="doodle" />

  <!-- 5. Coffee Mug with Steam -->
  <g class="doodle" transform="translate(25, 125) scale(0.85)">
    <rect x="4" y="8" width="16" height="15" rx="3" />
    <path d="M 20 11 C 24 11 24 17 20 17" />
    <path d="M 8 4 C 8 2 10 2 10 0 M 13 5 C 13 3 15 3 15 1" />
  </g>

  <!-- 6. Robot / Bot Head (WebGran Bot) -->
  <g class="doodle" transform="translate(125, 115) scale(0.85)">
    <rect x="4" y="6" width="18" height="15" rx="3" />
    <path d="M 13 6 L 13 2" />
    <circle cx="13" cy="1.5" r="1" />
    <circle cx="9" cy="12" r="1.5" />
    <circle cx="17" cy="12" r="1.5" />
    <path d="M 8 17 L 18 17" />
    <path d="M 2 12 L 4 12 M 22 12 L 24 12" />
  </g>

  <!-- 7. Musical Notes -->
  <g class="doodle" transform="translate(225, 115) scale(0.85)">
    <ellipse cx="6" cy="18" rx="3" ry="2.2" />
    <ellipse cx="18" cy="14" rx="3" ry="2.2" />
    <path d="M 9 18 L 9 4 L 21 0 L 21 14" />
    <path d="M 9 8 L 21 4" />
  </g>

  <!-- 8. Heart -->
  <g class="doodle" transform="translate(330, 115) scale(0.85)">
    <path d="M 12 21 C 2 13 2 4 8 2 C 11 1 12 4 12 4 C 12 4 13 1 16 2 C 22 4 22 13 12 21 Z" />
  </g>

  <!-- Mini filler dots & sparkles -->
  <circle cx="75" cy="175" r="1.5" class="doodle" />
  <g class="doodle" transform="translate(180, 165) scale(0.5)">
    <path d="M 8 0 L 8 16 M 0 8 L 16 8" />
  </g>
  <circle cx="280" cy="165" r="1.2" class="doodle" />
  <circle cx="375" cy="170" r="1.8" class="doodle" />

  <!-- 9. Diamond / Gem -->
  <g class="doodle" transform="translate(75, 205) scale(0.85)">
    <path d="M 6 4 L 18 4 L 24 10 L 12 22 L 0 10 Z" />
    <path d="M 0 10 L 24 10" />
    <path d="M 6 4 L 12 22 L 18 4" />
  </g>

  <!-- 10. Popsicle / Ice Cream -->
  <g class="doodle" transform="translate(180, 205) rotate(15) scale(0.85)">
    <rect x="5" y="2" width="12" height="16" rx="6" />
    <path d="M 11 18 L 11 25" />
    <path d="M 9 7 L 9 12 M 13 7 L 13 12" />
  </g>

  <!-- 11. Speech Bubble with typing dots -->
  <g class="doodle" transform="translate(275, 205) scale(0.85)">
    <rect x="2" y="3" width="22" height="15" rx="5" />
    <path d="M 6 18 L 3 23 L 11 18" />
    <circle cx="8" cy="10.5" r="1" />
    <circle cx="13" cy="10.5" r="1" />
    <circle cx="18" cy="10.5" r="1" />
  </g>

  <!-- 12. Shopping Bag (WebGran Store) -->
  <g class="doodle" transform="translate(350, 210) scale(0.85)">
    <rect x="4" y="7" width="16" height="17" rx="3" />
    <path d="M 8 7 C 8 2 16 2 16 7" />
    <circle cx="12" cy="14" r="1.5" />
  </g>

  <!-- Mini filler items -->
  <g class="doodle" transform="translate(35, 260) scale(0.5)">
    <path d="M 8 0 L 8 16 M 0 8 L 16 8" />
  </g>
  <circle cx="135" cy="265" r="1.5" class="doodle" />
  <circle cx="230" cy="260" r="1.2" class="doodle" />
  <g class="doodle" transform="translate(330, 265) scale(0.5)">
    <path d="M 8 0 L 8 16 M 0 8 L 16 8" />
  </g>

  <!-- 13. Space Rocket -->
  <g class="doodle" transform="translate(25, 295) rotate(-35) scale(0.85)">
    <path d="M 12 1 C 18 6 18 18 18 18 L 6 18 C 6 18 6 6 12 1 Z" />
    <circle cx="12" cy="10" r="2.5" />
    <path d="M 6 14 L 1 18 L 6 18 M 18 14 L 23 18 L 18 18" />
    <path d="M 8 18 L 12 24 L 16 18" />
  </g>

  <!-- 14. Game Controller (Telegram Mini App) -->
  <g class="doodle" transform="translate(120, 305) scale(0.85)">
    <rect x="2" y="6" width="22" height="13" rx="5" />
    <!-- D-pad -->
    <path d="M 7 10 L 7 15 M 4.5 12.5 L 9.5 12.5" />
    <!-- Buttons -->
    <circle cx="16" cy="11" r="1" />
    <circle cx="19" cy="14" r="1" />
  </g>

  <!-- 15. Smiley Face -->
  <g class="doodle" transform="translate(225, 300) scale(0.85)">
    <circle cx="12" cy="12" r="10" />
    <circle cx="8.5" cy="9.5" r="1.2" />
    <circle cx="15.5" cy="9.5" r="1.2" />
    <path d="M 8 15 C 10 18 14 18 16 15" />
  </g>

  <!-- 16. Cloud with Lightning -->
  <g class="doodle" transform="translate(325, 300) scale(0.85)">
    <path d="M 5 14 A 4 4 0 0 1 7 8 A 6 6 0 0 1 18 7 A 5 5 0 0 1 21 14 Z" />
    <path d="M 13 14 L 10 19 L 14 19 L 11 25" />
  </g>

  <!-- 17. Donut -->
  <g class="doodle" transform="translate(65, 365) scale(0.8)">
    <circle cx="12" cy="12" r="10" />
    <circle cx="12" cy="12" r="4" />
    <path d="M 8 5 L 9 7 M 15 5 L 16 7 M 6 13 L 8 13 M 17 14 L 19 14 M 11 18 L 13 18" />
  </g>

  <!-- 18. Flower / Daisy -->
  <g class="doodle" transform="translate(165, 365) scale(0.8)">
    <circle cx="12" cy="12" r="3.5" />
    <circle cx="12" cy="5" r="3.5" />
    <circle cx="19" cy="12" r="3.5" />
    <circle cx="12" cy="19" r="3.5" />
    <circle cx="5" cy="12" r="3.5" />
  </g>

  <!-- 19. Gift Box with Bow -->
  <g class="doodle" transform="translate(265, 360) scale(0.8)">
    <rect x="4" y="8" width="16" height="14" rx="2" />
    <rect x="2" y="5" width="20" height="4" rx="1.5" />
    <path d="M 12 5 L 12 22" />
    <path d="M 12 5 C 9 1 6 4 10 5 M 12 5 C 15 1 18 4 14 5" />
  </g>

  <!-- 20. Wrapped Candy -->
  <g class="doodle" transform="translate(355, 365) rotate(25) scale(0.8)">
    <circle cx="12" cy="12" r="6" />
    <path d="M 6 12 L 1 7 L 1 17 Z M 18 12 L 23 7 L 23 17 Z" />
  </g>

  <!-- Additional delicate edge fillers -->
  <circle cx="5" cy="200" r="1.5" class="doodle" />
  <circle cx="395" cy="100" r="1.5" class="doodle" />
  <circle cx="200" cy="5" r="1.5" class="doodle" />
  <circle cx="200" cy="395" r="1.5" class="doodle" />
</svg>

